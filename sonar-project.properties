# SonarQube Cloud, CI-based analysis: the scan runs in .github/workflows/pull-db-tests.yml
sonar.projectKey=CSCI-435-SE_gitea
sonar.organization=csci-435-se

# Test code is analysed as tests, so it is not counted as code that needs coverage
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*_test.go,**/*.test.ts,tests/**
sonar.test.inclusions=**/*_test.go,**/*.test.ts,tests/**

# Written by the test-unit job (Go) and the sonarqube job (TypeScript) before the scan
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info
