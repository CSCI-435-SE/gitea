name: Feature (User Story)
description: A feature for the CSCI 435 fork, written as an INVEST user story. Format in .claude-students/COURSE-WORKFLOW.md.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One owner per issue. Add the `scope:` label and the sprint milestone. A teammate must review the spec
        (comment `Spec reviewed — <notes>`) before implementation starts.
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Independent, Negotiable, Valuable, Estimable, Small, Testable.
      placeholder: As a <role>, I want <capability> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: User Scenario
      description: A short concrete walk-through of who does what, where, and what they see.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: At least 3, each testable with a clear pass/fail result.
      value: |
        - [ ] AC1: Given ..., when ..., then ...
        - [ ] AC2: Given ..., when ..., then ...
        - [ ] AC3: Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open Questions
      description: Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design Decision
      description: At least one non-trivial decision. Fill it in once an approach is chosen, before the PR.
      value: |
        **Decision:**
        **Alternatives Considered:**
        **Rationale:**
        **Consequences:**
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - small
        - medium
        - large
    validations:
      required: true
