name: Bug Report
description: Something in the CSCI 435 fork isn't working as expected. Format in .claude-students/COURSE-WORKFLOW.md.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One owner per issue. Add the `scope:` label and the sprint milestone. Before the fix starts, a teammate
        posts a review comment here starting `Spec reviewed` that says what they checked: whether each acceptance
        criterion is clear and testable, which cases they considered, and whether the scope fits.
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Version or commit, browser and OS, logs, screenshots.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design Decision
      description: At least one non-trivial decision about the fix. Name at least two alternatives. Fill it in once an approach is chosen, before the PR.
      value: |
        **Decision:**
        **Alternatives Considered:**
        **Rationale:**
        **Consequences:**
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - small
        - medium
        - large
    validations:
      required: true
  - type: textarea
    id: scope-justification
    attributes:
      label: Scope Justification
      description: One or two sentences on why this scope - which components it touches and how much change you expect.
    validations:
      required: true
