name: Bug Report
description: Something in the CSCI 435 fork isn't working as expected. Format in .claude-students/COURSE-WORKFLOW.md.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One owner per issue. Add the `scope:` label and the sprint milestone. A teammate must review the report
        (comment `Spec reviewed — <notes>`) before the fix starts.
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Version or commit, browser and OS, logs, screenshots.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design Decision
      description: At least one non-trivial decision about the fix. Fill it in once an approach is chosen, before the PR.
      value: |
        **Decision:**
        **Alternatives Considered:**
        **Rationale:**
        **Consequences:**
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - small
        - medium
        - large
    validations:
      required: true
